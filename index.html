<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainer">
<meta name="theme-color" content="#0E1116">
<style>
/* ── tokens: graphite, ember (heavy), steel-blue (light), mint (rest) ── */
:root{
  --bg:#0E1116; --surface:#171C24; --surface2:#1E2531; --line:#2A3340;
  --text:#EDEFF3; --dim:#8A93A3;
  --heavy:#FF7A45; --light:#7FB4FF; --rest:#4ED0A8; --prep:#C8CEDA; --danger:#F4647A;
  --display:'Avenir Next Condensed','Arial Narrow',-apple-system,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--body);
  height:100%;overscroll-behavior:none}
#app{min-height:100dvh;max-width:430px;margin:0 auto;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
@media (orientation:landscape){#app{max-width:960px}}
button{font-family:var(--body);cursor:pointer}
input,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  color:var(--text);padding:12px 14px;font-size:16px;font-family:var(--body);outline:none}
textarea{resize:vertical}
h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.5px;
  text-transform:uppercase;margin:0}
.sub{color:var(--dim);font-size:14px;margin:6px 0 24px}
.screen{padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom))}
.list-screen{padding-bottom:120px}
.btn{border:none;background:var(--heavy);color:#14100C;border-radius:12px;padding:12px 16px;
  font-size:15px;font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.danger{color:var(--danger);border-color:rgba(244,100,122,.33)}
.btn:disabled{opacity:.4}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card-head{display:flex;justify-content:space-between;align-items:baseline}
.card-name{font-family:var(--display);font-size:24px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.card-time{font-family:var(--display);font-size:18px;color:var(--dim)}
.card-desc{color:var(--dim);font-size:13px;margin-top:4px}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{font-family:var(--display);font-size:15px;padding:3px 10px;border-radius:999px}
.chip.h{border:1px solid var(--heavy);color:var(--heavy)}
.chip.l{border:1px solid var(--light);color:var(--light)}
.card-notes{margin-top:10px;font-size:13px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
.row{display:flex;gap:10px;margin-top:14px}
.row .btn{flex:0 0 auto}.row .grow{flex:1}
.fab{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:999px;
  padding:15px 26px;font-size:16px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.45);
  transition:transform .25s ease, opacity .25s ease;z-index:20}
.fab.hide{transform:translate(-50%,130px);opacity:0;pointer-events:none}
.field{margin-bottom:18px}
.label{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;font-weight:600}
.split{display:flex;gap:12px}.split>.field{flex:1}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px 0;border-radius:12px;border:1px solid var(--line);background:transparent;
  color:var(--dim);font-weight:600}
.seg button.on{border-color:var(--heavy);background:rgba(255,122,69,.13);color:var(--heavy)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;
  color:var(--text);font-size:20px}
.stepper .val{font-family:var(--display);font-size:28px;font-weight:600;width:36px;text-align:center}
.setrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.setrow .tag{font-family:var(--display);font-size:16px;width:90px;text-transform:uppercase;letter-spacing:1px;flex:0 0 auto}
.setrow input{flex:1;min-width:0}.setrow input.reps{flex:0 0 76px}.setrow .unit{color:var(--dim);font-size:13px;width:22px;flex:0 0 auto}
/* ── timer ── */
.timer{min-height:100dvh;display:flex;flex-direction:column;
  padding:max(24px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));
  transition:background .6s}
.t-top{display:flex;justify-content:space-between}
.t-back{background:transparent;border:none;color:var(--dim);font-size:15px;padding:0}
.t-name{font-family:var(--display);font-size:18px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px}
.t-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.t-phase{font-family:var(--display);font-size:22px;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px;text-align:center}
.t-val{font-family:var(--display);font-size:20px;color:var(--dim);margin-bottom:10px;min-height:24px;text-align:center}
.ringwrap{position:relative;width:290px;height:290px;flex-shrink:0}
.t-digits{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:88px;font-weight:700;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:8px;margin-top:22px;justify-content:center}
.dot{width:10px;height:10px;border-radius:999px;border:2px solid;transition:all .3s}
.dot.active{width:14px;height:14px}
.t-controls{margin-top:8px}
.t-controls .row{margin-top:0}
.t-reset{display:block;background:transparent;border:none;color:var(--dim);margin:12px auto 0;font-size:13px}
.t-done{font-family:var(--display);font-size:56px;font-weight:700;text-transform:uppercase;color:var(--rest);text-align:center}
.t-done-sub{color:var(--dim);margin:8px 0 20px;text-align:center}
@media (orientation:landscape) and (max-height:560px){
  .timer{padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
  .t-main{flex-direction:row;gap:40px}
  .ringwrap{width:220px;height:220px}
  .ringwrap svg{width:220px;height:220px}
  .t-digits{font-size:64px}
  .t-side{width:300px;max-width:45%}
  .t-phase,.t-val{text-align:left}
  .t-main .dots{justify-content:flex-start;margin:14px 0 22px}
}
/* ── modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:340px}
.modal h3{margin:0 0 8px;font-size:17px}
.modal p{color:var(--dim);font-size:14px;margin:0 0 20px}
.backup-link{background:transparent;border:none;color:var(--dim);font-size:13px;text-decoration:underline;display:block;margin:24px auto 0}
.saved{color:var(--dim);font-size:12px;letter-spacing:1px;text-transform:uppercase;text-align:center;
  height:16px;margin-bottom:10px;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.saved.ok{color:var(--rest)}
.vidrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.vidlink{font-size:13px;color:var(--light);border:1px solid var(--line);border-radius:999px;
  padding:5px 12px;text-decoration:none;background:var(--surface2)}
.vx{width:44px;height:44px;flex:0 0 44px;border-radius:12px;border:1px solid var(--line);
  background:transparent;color:var(--danger);font-size:20px}
input[type=range]{-webkit-appearance:none;background:transparent;padding:0;border:none;height:28px}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:999px;
  background:var(--heavy);margin-top:-9px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ════════ CRASH GUARD — a JS error must never leave a black screen ════ */
window.addEventListener('error', function(e){
  try{
    if(document.getElementById('crash')) return;
    var raw = ''; try{ raw = localStorage.getItem('trainer.data') || ''; }catch(x){}
    var d = document.createElement('div');
    d.id = 'crash';
    d.style.cssText = 'padding:28px 20px;color:#EDEFF3;font-family:-apple-system,sans-serif';
    d.innerHTML = '<h2 style="margin:0 0 8px">Something went wrong</h2>'
      + '<p style="color:#8A93A3;font-size:14px">The app hit an error while starting. '
      + 'Your workouts are safe — copy the backup below, then reload. '
      + 'If it keeps happening, send this to the developer (Claude):</p>'
      + '<pre style="white-space:pre-wrap;font-size:12px;color:#F4647A;background:#171C24;'
      + 'border-radius:12px;padding:12px">' + (e.message||'unknown error')
      + (e.filename?'\n'+e.filename+':'+e.lineno:'') + '</pre>'
      + '<div style="font-size:12px;color:#8A93A3;margin:14px 0 6px">YOUR DATA BACKUP — copy to Notes:</div>'
      + '<textarea style="width:100%;height:90px;background:#171C24;color:#EDEFF3;border:1px solid #2A3340;'
      + 'border-radius:12px;padding:10px;font-size:11px">' + raw.replace(/</g,'&lt;') + '</textarea>'
      + '<button onclick="location.reload()" style="width:100%;margin-top:14px;padding:14px;border:none;'
      + 'border-radius:12px;background:#FF7A45;color:#14100C;font-weight:700;font-size:16px">Reload app</button>';
    document.body.appendChild(d);
  }catch(x){}
});

/* ════════ DATA — versioned so future updates never lose workouts ════════
   The storage key never changes. Every saved blob carries a schemaVersion.
   When a future app version needs a new shape, add a step to migrate():
   data is upgraded in place, never discarded.                            */
function uid(){ return Math.random().toString(36).slice(2,10); }
const KEY = 'trainer.data';            // ← never change this key
const SCHEMA_VERSION = 7;

function migrate(d){
  if (!d || typeof d !== 'object') d = { schemaVersion: SCHEMA_VERSION, exercises: [] };
  if (!d.schemaVersion){ d = { schemaVersion: 1, exercises: Array.isArray(d.exercises) ? d.exercises : (Array.isArray(d) ? d : []) }; }
  if (d.schemaVersion === 1){
    (d.exercises||[]).forEach(e => { if(!Array.isArray(e.setReps)) e.setReps = (e.setValues||[]).map(()=>''); });
    d.schemaVersion = 2;
  }
  if (d.schemaVersion === 2){
    d.settings = d.settings || { sound: true, volume: 0.8, halfway: true };
    d.schemaVersion = 3;
  }
  if (d.schemaVersion === 3){
    (d.exercises||[]).forEach(e => {
      if(e.sprints == null) e.sprints = e.mode==='run'
        ? Math.max(1,(e.heavySets||0)+(e.lightSets||0)) : 4;
      if(!e.distanceUnit) e.distanceUnit = 'km';
    });
    d.schemaVersion = 4;
  }
  if (d.schemaVersion === 4){
    (d.exercises||[]).forEach(e => { if(!Array.isArray(e.videos)) e.videos = []; });
    d.schemaVersion = 5;
  }
  if (d.schemaVersion === 5){
    (d.exercises||[]).forEach(e => { if(e.equipment == null) e.equipment = ''; });
    d.workouts = d.workouts || [];
    d.schemaVersion = 6;
  }
  if (d.schemaVersion === 6){
    (d.workouts||[]).forEach(w => {
      if(!Array.isArray(w.blocks))
        w.blocks = (w.items||[]).map(id => ({ id: uid(), type:'exercise', exerciseId:id }));
      delete w.items;
    });
    d.schemaVersion = 7;
  }
  if (!Array.isArray(d.exercises)) d.exercises = [];
  if (!Array.isArray(d.workouts)) d.workouts = [];
  (d.workouts||[]).forEach(w => { if(!Array.isArray(w.blocks)) w.blocks = []; });
  if (!d.settings) d.settings = { sound: true, volume: 0.8, halfway: true };
  /* future upgrades go here following the same pattern */
  return d;
}
function loadData(){
  try { const raw = localStorage.getItem(KEY); if (raw) return migrate(JSON.parse(raw)); } catch(e){}
  return migrate(null);   /* fresh install: normalized the same way as loaded data */
}
function saveData(){ try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){ console.error('save failed', e); } }

let data = loadData();

const blank = () => ({ id: uid(), name:'', description:'', mode:'weights',
  heavySets:3, lightSets:2, sprints:4, distanceUnit:'km',
  setValues:['','','','',''], setReps:['','','','',''],
  videos:[], equipment:'', workSec:45, restSec:60, notes:'' });
const blankWorkout = () => ({ id: uid(), name:'', betweenSec:90, blocks:[] });
const blankTimedBlock = () => ({ id: uid(), type:'timed', name:'',
  steps:[{name:'', sec:30}], restSec:0, videos:[], equipment:'' });
const blockLabel = b => {
  if(b.type==='exercise'){ const e = data.exercises.find(x=>x.id===b.exerciseId);
    return e ? e.name : 'Missing exercise'; }
  return b.name || 'Timed session';
};
/* commit a workout to storage (shared by workout + block editors) */
function commitWorkout(w){
  if(!w.name.trim()) return false;
  const clean = JSON.parse(JSON.stringify(w));
  const i = data.workouts.findIndex(x => x.id === w.id);
  if(i >= 0) data.workouts[i] = clean; else data.workouts.push(clean);
  saveData(); return true;
}
const totalSetsOf = ex => ex.mode==='run' ? (ex.sprints||0) : ex.heavySets+ex.lightSets;
const unitOf = ex => ex.mode==='run' ? (ex.distanceUnit||'km') : 'kg';
const resizeVals = (v,n) => { const o=v.slice(0,n); while(o.length<n) o.push(''); return o; };
const fmt = s => Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ════════ AUDIO (unlocked on first tap — iOS requirement) ════════ */
let audioCtx = null;
function ensureAudio(){ try{ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){} }
/* tone(freq, dur, delay, {vol, type, glide}) — glide slides to a 2nd pitch */
function tone(f=880, d=.15, w=0, opt={}){
  try{
    if(!data.settings.sound && !opt.force) return;
    /* opt.force previews still respect the volume slider */
    ensureAudio(); if(!audioCtx) return;
    const t=audioCtx.currentTime+w, o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type = opt.type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if(opt.glide) o.frequency.exponentialRampToValueAtTime(opt.glide, t+d);
    const peak = Math.max(.02, (opt.vol!=null?opt.vol:.4) * (data.settings.volume!=null?data.settings.volume:.8));
    g.gain.setValueAtTime(.001,t);
    g.gain.exponentialRampToValueAtTime(peak, t+.02);
    g.gain.exponentialRampToValueAtTime(.001, t+d);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+d+.05);
  }catch(e){}
}
const beep = (f,d,w)=> tone(f,d,w);

/* ── cues play through <audio> media elements, NOT WebAudio ─────
   Reason: iOS suspends WebAudio the instant the app is
   backgrounded, so synthesized beeps only fired on return.
   Media elements keep playing in the background (same channel as
   the keep-alive track), so these sound on time from other apps. */
const cueEls = {};
function cueEl(n){
  if(!cueEls[n]){
    const a = new Audio(cueData[n]);
    a.setAttribute('playsinline',''); a.preload = 'auto';
    cueEls[n] = a;
  }
  return cueEls[n];
}
function playCue(n, force){
  try{
    if(!data.settings.sound && !force) return;
    const a = cueEl(n);
    a.volume = Math.max(.05, Math.min(1, data.settings.volume != null ? data.settings.volume : .8));
    a.currentTime = 0;
    a.play().catch(()=>{});
  }catch(e){}
}
const sndHeavyStart = f => playCue('heavy', f);
const sndLightStart = f => playCue('light', f);
const sndSetEnd     = f => playCue('setend', f);
const sndRestStart  = f => playCue('rest', f);
const sndHalfway    = f => playCue('half', f);
const sndCountTick  = f => playCue('tick', f);
const sndPrepTick   = f => playCue('prep', f);
const sndAllDone    = f => playCue('done', f);

   The one sanctioned way to keep running is an active audio
   session — so during a workout we loop a near-silent track via
   an <audio> element, exactly like music apps do. Bonus: media
   playback ignores the ring/silent switch, so cues become
   audible even in silent mode once the session is running.    */

keepAlive.loop = true;

   By default iOS lets one audio app interrupt another, so opening
   YouTube/Spotify seized the session and silenced the trainer.
   Where supported (iOS 17+), we declare our session 'ambient':
   our cues MIX with other apps' sound instead of fighting it.
   Note: ambient audio respects the ring/silent switch.          */
function setMixing(){
  try{ if('audioSession' in navigator) navigator.audioSession.type = 'ambient'; }catch(e){}
}
setMixing();

let sessionWanted = false;   // should the keep-alive be playing right now?
function sessionOn(){
  sessionWanted = true;
  try{ setMixing(); keepAlive.play().catch(()=>{});
    if('mediaSession' in navigator){ try{
      navigator.mediaSession.metadata = new MediaMetadata({ title:'Workout running', artist:'Trainer' });
    }catch(e){} } }catch(e){}
}
function sessionOff(){ sessionWanted = false; try{ keepAlive.pause(); }catch(e){} }

/* ── interruption recovery ─────────────────────────────────────
   If another app still grabs the session (older iOS, phone call,
   Siri), our keep-alive gets paused externally. Instead of
   staying dead, retry every 2s while a timer wants audio, and
   immediately when the app returns to the foreground.           */
keepAlive.addEventListener('pause', ()=>{
  if(sessionWanted) setTimeout(()=>{ if(sessionWanted) keepAlive.play().catch(()=>{}); }, 400);
});
setInterval(()=>{ if(sessionWanted && keepAlive.paused) keepAlive.play().catch(()=>{}); }, 2000);
['visibilitychange','pageshow','focus'].forEach(ev =>
  addEventListener(ev, ()=>{ if(document.visibilityState !== 'hidden' && sessionWanted){
    setMixing(); keepAlive.play().catch(()=>{});
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }}, true));

/* canonical iOS unlock: create ctx AND push one silent buffer through it
   inside the first real user gesture */
function unlockAudio(){
  ensureAudio();
  try{ if(audioCtx){ const b=audioCtx.createBuffer(1,1,22050);
    const s=audioCtx.createBufferSource(); s.buffer=b;
    s.connect(audioCtx.destination); s.start(0); } }catch(e){}
  try{ Object.keys(cueData).forEach(n => {
    const a = cueEl(n); a.muted = true;
    a.play().then(()=>{ a.pause(); a.currentTime = 0; a.muted = false; })
            .catch(()=>{ a.muted = false; });
  }); }catch(e){}
}
['touchend','click'].forEach(ev => document.addEventListener(ev, unlockAudio, {once:true}));
/* iOS suspends audio when the app is backgrounded — wake it on return */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && audioCtx && audioCtx.state==='suspended') audioCtx.resume();
});

/* ════════ RENDERING ════════ */
const app = document.getElementById('app');
let timer = null; // active timer state

let editFlush = null;   // set while an editor is open
let afterEdit = null;   // exercise editor opened from the workout builder
function go(view, arg){
  if(editFlush){ editFlush(); editFlush = null; }
  if(timer){ clearInterval(timer.iv); timer=null; sessionOff(); }
  if(view==='wedit'){ renderWorkoutEdit(arg); window.scrollTo(0,0); return; }
  if(view==='tedit'){ renderTimedEdit(arg.w, arg.idx); window.scrollTo(0,0); return; }
  if(view==='list') renderList();
  else if(view==='edit') renderEdit(arg);
  else if(view==='timer') renderTimer(arg);
  window.scrollTo(0,0);
}

/* ── LIST ── */
function renderList(){
  const exs = data.exercises;
  app.innerHTML = `
  <div class="screen list-screen">
    <h1>Today's work</h1>
    <div class="sub">${exs.length===0 && data.workouts.length===0

    <div class="label" style="margin-bottom:10px">Exercises</div>
    <div id="cards"></div>
    <button class="backup-link" id="soundBtn">Sound settings</button>
    <div style="text-align:center;color:var(--line);font-size:11px;margin-top:18px">app version 17</div>
    <button class="backup-link" id="backupBtn">Backup &amp; restore workouts</button>
  </div>
  <button class="fab" id="addBtn">+ Add exercise</button>`;
  /* workout cards */
  const wcards = document.getElementById('wcards');
  data.workouts.forEach(w => {
    const labels = (w.blocks||[]).map(blockLabel);
    const wexs = labels; /* count of blocks */
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="tap" style="cursor:pointer">
        <div class="card-head"><div class="card-name">${esc(w.name)||'Untitled workout'}</div>
          <div class="card-time">${labels.length} block${labels.length===1?'':'s'}</div></div>
        ${labels.length?`<div class="card-desc">${labels.map(esc).join(' → ')}</div>`
          :'<div class="card-desc">Empty — tap Edit to add blocks</div>'}
      </div>
      <div class="row">
        ${wexs.length?'<button class="btn grow start">Start workout</button>':''}
        <button class="btn ghost edit">Edit</button>
        <button class="btn ghost danger del">Delete</button>
      </div>`;
    const start = ()=>{ if(wexs.length){ ensureAudio(); go('timer', {wo:w.id}); } };
    card.querySelector('.tap').onclick = start;
    const sb = card.querySelector('.start'); if(sb) sb.onclick = start;
    card.querySelector('.edit').onclick = ()=> go('wedit', JSON.parse(JSON.stringify(w)));
    card.querySelector('.del').onclick = ()=> confirmDeleteWorkout(w.id);
    wcards.appendChild(card);
  });
  document.getElementById('woAdd').onclick = ()=> go('wedit', blankWorkout());

  const cards = document.getElementById('cards');
  exs.forEach(ex => {
    const total = totalSetsOf(ex);
    const unit = unitOf(ex);
    const run = ex.mode==='run';
    const chips = Array.from({length: total}).map((_,i)=>{
      const v = ex.setValues[i], r = (ex.setReps||[])[i];
      const txt = (v?esc(v)+' '+unit:'—') + (!run && r?' × '+esc(r):'');
      return `<span class="chip ${!run && i<ex.heavySets?'h':'l'}">${txt}</span>`;
    }).join('');
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="tap" style="cursor:pointer">
        <div class="card-head"><div class="card-name">${esc(ex.name)||'Untitled'}</div>
          <div class="card-time">${fmt(ex.workSec)} / ${fmt(ex.restSec)}</div></div>
        ${ex.description?`<div class="card-desc">${esc(ex.description)}</div>`:''}
        ${ex.equipment?`<div class="card-desc">⚙ ${esc(ex.equipment)}</div>`:''}
        <div class="chips">${chips}</div>
        ${ex.notes?`<div class="card-notes">${esc(ex.notes)}</div>`:''}
      </div>
      ${(()=>{const vs=(ex.videos||[]).filter(u=>u&&u.trim());
        return vs.length?`<div class="vidrow">${vs.map((u,i)=>
          `<a class="vidlink" href="${esc(u)}" target="_blank" rel="noopener">▶ Video ${i+1}</a>`).join('')}</div>`:'';})()}
      <div class="row">
        <button class="btn grow start">Start timer</button>
        <button class="btn ghost edit">Edit</button>
        <button class="btn ghost danger del">Delete</button>
      </div>`;
    const start = ()=>{ ensureAudio(); go('timer', {ex:ex.id}); };
    card.querySelector('.tap').onclick = start;
    card.querySelector('.start').onclick = start;
    card.querySelector('.edit').onclick = ()=> go('edit', JSON.parse(JSON.stringify(ex)));
    card.querySelector('.del').onclick = ()=> confirmDelete(ex.id);
    cards.appendChild(card);
  });
  document.getElementById('addBtn').onclick = ()=> go('edit', blank());
  /* the button steps out of the way while you scroll down the list
     and returns as soon as you scroll up (or reach the top) */
  if(!window._fabScroll){
    window._fabScroll = true;
    let lastY = 0;
    addEventListener('scroll', ()=>{
      const fab = document.getElementById('addBtn');
      if(!fab) return;
      const y = window.scrollY || 0;
      if(y > lastY + 6 && y > 60) fab.classList.add('hide');
      else if(y < lastY - 6 || y <= 60) fab.classList.remove('hide');
      lastY = y;
    }, {passive:true});
  }
  document.getElementById('backupBtn').onclick = backupModal;
  document.getElementById('soundBtn').onclick = soundModal;
}

function confirmDelete(id){
  modal(`<h3>Delete this exercise?</h3><p>Its sets, weights and notes will be removed.</p>
    <div class="row" style="margin-top:0">
      <button class="btn ghost grow" data-x>Keep it</button>
      <button class="btn grow" style="background:var(--danger);color:#fff" data-del>Delete</button></div>`,
    el => { el.querySelector('[data-del]').onclick = ()=>{
      data.exercises = data.exercises.filter(e=>e.id!==id);
      data.workouts.forEach(w => {
        w.blocks = (w.blocks||[]).filter(b => !(b.type==='exercise' && b.exerciseId===id)); });
      saveData(); closeModal(); renderList(); }; });
}

function confirmDeleteWorkout(id){
  modal(`<h3>Delete this workout?</h3><p>The exercises inside it are kept — only the workout is removed.</p>
    <div class="row" style="margin-top:0">
      <button class="btn ghost grow" data-x>Keep it</button>
      <button class="btn grow" style="background:var(--danger);color:#fff" data-del>Delete</button></div>`,
    el => { el.querySelector('[data-del]').onclick = ()=>{
      data.workouts = data.workouts.filter(w=>w.id!==id); saveData(); closeModal(); renderList(); }; });
}

/* ── SOUND SETTINGS ── */
function soundModal(){
  const s = data.settings;
  modal(`<h3>Sound</h3>
    <p>Tap a cue to hear it. Keep the ring/silent switch on <b>ring</b> — iOS mutes web audio in silent mode.</p>
    <div class="seg" style="margin-bottom:14px">
      <button id="s-on">Sound on</button><button id="s-off">Muted</button></div>
    <div class="label">Volume</div>
    <input type="range" id="s-vol" min="0.1" max="1" step="0.1" style="padding:0;margin-bottom:16px">
    <div class="seg" style="margin-bottom:16px">
      <button id="s-half">Halfway cue on</button><button id="s-nohalf">Off</button></div>
    <div class="label">Test cues</div>
    <div class="row" style="margin-top:0;flex-wrap:wrap;gap:8px">
      <button class="btn ghost" style="flex:1" id="t-heavy">Heavy</button>
      <button class="btn ghost" style="flex:1" id="t-light">Light</button>
      <button class="btn ghost" style="flex:1" id="t-rest">Rest</button>
      <button class="btn ghost" style="flex:1" id="t-done">Finish</button>
    </div>
    <div class="row"><button class="btn grow" data-x>Close</button></div>`,
  el => {
    const $$ = i => el.querySelector('#'+i);
    /* previews must run inside an active media session, otherwise the
       ring/silent switch mutes them (same trick the workout timer uses) */
    let prevT = null;
    function preview(fn){
      ensureAudio(); sessionOn(); fn(true);
      clearTimeout(prevT);
      prevT = setTimeout(()=>{ if(!(timer && timer.running)) sessionOff(); }, 3000);
    }
    function paint(){
      $$('s-on').className  = s.sound ? 'on' : '';
      $$('s-off').className = s.sound ? '' : 'on';
      $$('s-half').className  = s.halfway ? 'on' : '';
      $$('s-nohalf').className= s.halfway ? '' : 'on';
      $$('s-vol').value = s.volume;
    }
    paint();
    $$('s-on').onclick  = ()=>{ s.sound = true;  saveData(); paint(); preview(sndLightStart); };
    $$('s-off').onclick = ()=>{ s.sound = false; saveData(); paint(); };
    $$('s-half').onclick  = ()=>{ s.halfway = true;  saveData(); paint(); preview(sndHalfway); };
    $$('s-nohalf').onclick= ()=>{ s.halfway = false; saveData(); paint(); };
    $$('s-vol').oninput = e => { s.volume = parseFloat(e.target.value); saveData(); };
    $$('s-vol').onchange = ()=>{ preview(sndLightStart); };
    $$('t-heavy').onclick = ()=> preview(sndHeavyStart);
    $$('t-light').onclick = ()=> preview(sndLightStart);
    $$('t-rest').onclick  = ()=> preview(sndRestStart);
    $$('t-done').onclick  = ()=> preview(sndAllDone);
  });
}

/* ── BACKUP / RESTORE (also protects data across hosting moves) ── */
function backupModal(){
  modal(`<h3>Backup &amp; restore</h3>
    <p>Copy this text somewhere safe (Notes, email). Paste a backup here and tap Restore to bring workouts back.</p>
    <textarea id="bk" rows="6" style="font-size:12px"></textarea>
    <div class="row">
      <button class="btn ghost grow" data-copy>Copy backup</button>
      <button class="btn grow" data-restore>Restore</button></div>
    <div class="row"><button class="btn ghost grow" data-x>Close</button></div>`,
    el => {
      const ta = el.querySelector('#bk'); ta.value = JSON.stringify(data);
      el.querySelector('[data-copy]').onclick = ()=>{ ta.select();
        navigator.clipboard ? navigator.clipboard.writeText(ta.value) : document.execCommand('copy');
        el.querySelector('[data-copy]').textContent = 'Copied ✓'; };
      el.querySelector('[data-restore]').onclick = ()=>{
        try { const d = migrate(JSON.parse(ta.value));
          if(!Array.isArray(d.exercises)) throw 0;
          data = d; saveData(); closeModal(); renderList(); }
        catch(e){ ta.value = 'Could not read that backup — paste the exact text you copied.'; } };
    });
}

function modal(html, wire){
  const ov = document.createElement('div'); ov.className='overlay'; ov.id='ov';
  ov.innerHTML = `<div class="modal">${html}</div>`;
  ov.onclick = e => { if(e.target===ov) closeModal(); };
  const x = ov.querySelector('[data-x]'); if(x) x.onclick = closeModal;
  document.body.appendChild(ov); if(wire) wire(ov);
}
function closeModal(){ const ov=document.getElementById('ov'); if(ov) ov.remove(); }

/* ── EDIT ── */
function renderEdit(ex){
  const isNew = !data.exercises.some(e=>e.id===ex.id);
  app.innerHTML = `<div class="screen">
    <h1 style="font-size:34px;margin-bottom:20px">${isNew?'New exercise':'Edit exercise'}</h1>
    <div class="field"><div class="label">Exercise name</div>
      <input id="f-name" placeholder="e.g. Back squat"></div>
    <div class="field"><div class="label">Description</div>
      <textarea id="f-desc" rows="2" placeholder="Form cues, tempo, machine settings…"></textarea></div>
    <div class="field"><div class="label">Type</div>
      <div class="seg"><button id="m-w">Weights</button><button id="m-r">Run</button></div></div>
    <div class="split" id="wsets">
      <div class="field"><div class="label">Heavy sets</div>
        <div class="stepper"><button id="h-">−</button><span class="val" id="h-val" style="color:var(--heavy)"></span><button id="h+">+</button></div></div>
      <div class="field"><div class="label">Light sets</div>
        <div class="stepper"><button id="l-">−</button><span class="val" id="l-val" style="color:var(--light)"></span><button id="l+">+</button></div></div>
    </div>
    <div class="split" id="rsets" style="display:none">
      <div class="field"><div class="label">Sprints</div>
        <div class="stepper"><button id="s-">−</button><span class="val" id="s-val" style="color:var(--light)"></span><button id="s+">+</button></div></div>
      <div class="field"><div class="label">Distance unit</div>
        <div class="seg"><button id="u-m">m</button><button id="u-km">km</button></div></div>
    </div>
    <div class="split">
      <div class="field"><div class="label">Work (seconds)</div>
        <input id="f-work" type="number" inputmode="numeric" min="5" max="3600"></div>
      <div class="field"><div class="label">Rest (seconds)</div>
        <input id="f-rest" type="number" inputmode="numeric" min="5" max="3600"></div>
    </div>
    <div class="field"><div class="label" id="sets-label"></div><div id="sets"></div></div>
    <div class="field"><div class="label">Equipment (optional)</div>
      <input id="f-equip" placeholder="e.g. bodyweight, resistance band, kettlebell"></div>
    <div class="field"><div class="label">YouTube videos</div>
      <div id="vids"></div>
      <button class="btn ghost" id="vid-add" style="width:100%">+ Add video link</button></div>
    <div class="field"><div class="label">Notes</div>
      <textarea id="f-notes" rows="3" placeholder="PRs, how it felt, what to change next time…"></textarea></div>
    <div class="saved" id="savedmsg"></div>
    <div class="row">
      <button class="btn ghost grow" id="cancel">Discard changes</button>
      <button class="btn" id="save" style="flex:2">Done</button></div>
  </div>`;
  const $ = id => document.getElementById(id);

  /* ── AUTOSAVE ──────────────────────────────────────────────
     Every change is written to storage ~0.6s after you stop
     typing, and immediately when you leave the screen, switch
     apps or close the tab. A new exercise starts saving as
     soon as it has a name.                                   */
  const snapshot = JSON.stringify(ex);   // for "Discard changes"
  let saveTimer = null, dirty = false;

  function commit(){
    if(!ex.name.trim()) return false;    // don't store unnamed drafts
    const clean = JSON.parse(JSON.stringify(ex));
    clean.videos = (clean.videos||[]).filter(u => u && u.trim());
    const i = data.exercises.findIndex(e => e.id === ex.id);
    if(i >= 0) data.exercises[i] = clean;
    else data.exercises.push(clean);
    saveData(); dirty = false; return true;
  }
  function flash(txt, ok){
    const m = $('savedmsg'); if(!m) return;
    m.textContent = txt; m.className = 'saved on' + (ok ? ' ok' : '');
    clearTimeout(m._t); m._t = setTimeout(()=>{ m.className = 'saved'; }, 1600);
  }
  function touch(){                       // call after ANY edit
    dirty = true;
    const m = $('savedmsg'); if(m){ m.textContent = 'Saving…'; m.className = 'saved on'; }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{ commit() ? flash('Saved \u2713', true) : flash('Add a name to save'); }, 600);
  }
  function flush(){                       // save right now, no waiting
    clearTimeout(saveTimer);
    if(dirty) commit();
  }
  editFlush = flush;                      // used by go() and page-exit events

  $('f-name').value = ex.name; $('f-desc').value = ex.description; $('f-notes').value = ex.notes;
  $('f-equip').value = ex.equipment || '';
  $('f-equip').oninput = e=>{ ex.equipment = e.target.value; touch(); };
  $('f-work').value = ex.workSec; $('f-rest').value = ex.restSec;
  function commitSec(id, key){ const el=$(id);
    el.onblur = ()=>{ const n=Math.min(3600,Math.max(5,parseInt(el.value,10)||5)); el.value=n; ex[key]=n; touch(); }; }
  commitSec('f-work','workSec'); commitSec('f-rest','restSec');
  $('f-name').oninput = e=>{ ex.name = e.target.value; touch(); };
  $('f-desc').oninput = e=>{ ex.description = e.target.value; touch(); };
  $('f-notes').oninput = e=>{ ex.notes = e.target.value; touch(); };

  function drawMode(){
    const run = ex.mode==='run';
    $('m-w').className = run?'':'on'; $('m-r').className = run?'on':'';
    $('wsets').style.display = run?'none':'flex';
    $('rsets').style.display = run?'flex':'none';
    $('u-m').className  = ex.distanceUnit==='m' ?'on':'';
    $('u-km').className = ex.distanceUnit==='km'?'on':'';
    drawCounts();
  }
  $('m-w').onclick = ()=>{ ex.mode='weights'; drawMode(); touch(); };
  $('m-r').onclick = ()=>{ ex.mode='run'; drawMode(); touch(); };
  $('u-m').onclick  = ()=>{ ex.distanceUnit='m';  drawMode(); touch(); };
  $('u-km').onclick = ()=>{ ex.distanceUnit='km'; drawMode(); touch(); };
  $('s+').onclick = ()=>{ ex.sprints++; drawCounts(); touch(); };
  $('s-').onclick = ()=>{ if(ex.sprints>1){ ex.sprints--; drawCounts(); touch(); } };

  function drawCounts(){
    $('h-val').textContent = ex.heavySets; $('l-val').textContent = ex.lightSets;
    $('s-val').textContent = ex.sprints;
    const n = totalSetsOf(ex);
    ex.setValues = resizeVals(ex.setValues, n);
    ex.setReps = resizeVals(ex.setReps||[], n); drawSets(); }
  $('h+').onclick = ()=>{ ex.heavySets++; drawCounts(); touch(); };
  $('h-').onclick = ()=>{ if(ex.heavySets>0){ ex.heavySets--; drawCounts(); touch(); } };
  $('l+').onclick = ()=>{ ex.lightSets++; drawCounts(); touch(); };
  $('l-').onclick = ()=>{ if(ex.lightSets>0){ ex.lightSets--; drawCounts(); touch(); } };

  function drawSets(){
    const run = ex.mode==='run';
    const unit = unitOf(ex);
    $('sets-label').textContent = run
      ? 'Distance per sprint ('+unit+')' : 'Weight per set (kg)';
    const box = $('sets'); box.innerHTML='';
    for(let i=0;i<totalSetsOf(ex);i++){
      const heavy = !run && i<ex.heavySets;
      const label = run ? 'Sprint '+(i+1)
        : (heavy ? 'Heavy '+(i+1) : 'Light '+(i-ex.heavySets+1));
      const row = document.createElement('div'); row.className='setrow';
      row.innerHTML = `<span class="tag" style="color:var(--${heavy?'heavy':'light'})">${label}</span>
        <input type="number" inputmode="decimal" placeholder="${unit}"><span class="unit">${unit}</span>`
        + (run ? '' :
        `<input type="number" inputmode="numeric" class="reps" placeholder="reps"><span class="unit">×</span>`);
      const inputs = row.querySelectorAll('input');
      inputs[0].value = ex.setValues[i];
      inputs[0].oninput = e => { ex.setValues[i] = e.target.value; touch(); };
      if(!run){
        inputs[1].value = (ex.setReps||[])[i] || '';
        inputs[1].oninput = e => { ex.setReps[i] = e.target.value; touch(); };
      }
      box.appendChild(row);
    }
  }
  function drawVids(){
    const box = $('vids'); box.innerHTML = '';
    (ex.videos = ex.videos || []).forEach((u, i) => {
      const row = document.createElement('div'); row.className = 'setrow';
      row.innerHTML = `<input type="url" inputmode="url" autocapitalize="off"
        placeholder="https://youtube.com/watch?v=…"><button class="vx">×</button>`;
      const inp = row.querySelector('input'); inp.value = u;
      inp.oninput = e => { ex.videos[i] = e.target.value; touch(); };
      row.querySelector('.vx').onclick = () => { ex.videos.splice(i,1); drawVids(); touch(); };
      box.appendChild(row);
    });
  }
  $('vid-add').onclick = () => { (ex.videos = ex.videos || []).push(''); drawVids(); touch();
    const last = $('vids').querySelector('.setrow:last-child input'); if(last) last.focus(); };

  drawMode(); drawCounts(); drawVids();

  $('cancel').onclick = ()=>{
    clearTimeout(saveTimer); dirty = false; editFlush = null;
    const orig = JSON.parse(snapshot);
    const i = data.exercises.findIndex(e => e.id === ex.id);
    if(isNew){ if(i >= 0) data.exercises.splice(i,1); }   // remove autosaved draft
    else if(i >= 0) data.exercises[i] = orig;             // roll back to how it was
    saveData();
    const cb = afterEdit; afterEdit = null;
    if(cb) cb(null); else go('list');
  };
  $('save').onclick = ()=>{ if(!ex.name.trim()){ $('f-name').focus(); flash('Add a name to save'); return; }
    flush(); editFlush = null;
    const cb = afterEdit; afterEdit = null;
    if(cb) cb(ex.id); else go('list'); };
}

/* ── WORKOUT BUILDER — a workout is an ordered list of BLOCKS ──
   Block types:
   • exercise — a strength/run exercise from your library
   • timed    — a named session of timed steps (stretching, yoga
                with a video, mobility, breathing…)               */
function renderWorkoutEdit(w){

  app.innerHTML = `<div class="screen">

/* ── TIMER (5s get-ready, then work/rest cycles; auto-starts) ── */
function planForExercise(ex){
  const p=[], run=ex.mode==='run', total=totalSetsOf(ex);
  for(let i=0;i<total;i++){ const h=!run && i<ex.heavySets;
    p.push({kind:'work', ex, setIndex:i, isHeavy:h, isRun:run, dur:ex.workSec,
            value:ex.setValues[i], reps: run ? '' : (ex.setReps||[])[i]});
    if(i<total-1) p.push({kind:'rest', ex, setIndex:i, isHeavy:h, isRun:run, dur:ex.restSec}); }
  return p;
}
function buildPlan(ex){
  const p = planForExercise(ex);
  if(p.length) p.unshift({kind:'prep', ex, setIndex:0, dur:5});
  return p;
}
function planForTimed(b){
  const p = [];
  const steps = (b.steps||[]).filter(s => (s.name&&s.name.trim()) || s.sec);
  steps.forEach((s, i) => {
    p.push({kind:'work', tStep:true, stepName:(s.name&&s.name.trim())||('Step '+(i+1)),
            setIndex:i, dur:Math.max(5, parseInt(s.sec,10)||5)});
    if(i < steps.length-1 && (b.restSec||0) > 0)
      p.push({kind:'rest', setIndex:i, dur:b.restSec});
  });
  return p;
}
/* a workout chains BLOCK plans with a "next up" transition between them */
function buildWorkoutPlan(w){
  const blocks = (w.blocks||[]).map(b => {
    if(b.type==='exercise'){
      const ex = data.exercises.find(e=>e.id===b.exerciseId);
      if(!ex) return null;
      return { name: ex.name, ex, videos: ex.videos, equipment: ex.equipment,
               sub: planForExercise(ex), dots: totalSetsOf(ex) };
    }
    const sub = planForTimed(b);
    return { name: b.name||'Timed session', videos: b.videos, equipment: b.equipment,
             sub, dots: sub.filter(x=>x.kind==='work').length };
  }).filter(x => x && x.sub.length);
  const plan = [];
  blocks.forEach((blk, k) => {
    if(plan.length === 0) plan.push({kind:'prep', dur:5, blk, exIdx:k});
    else plan.push({kind:'between', dur:Math.max(5, w.betweenSec||60), blk, exIdx:k});
    blk.sub.forEach(s => { s.blk = blk; s.exIdx = k; plan.push(s); });
  });
  return { plan, blocks };
}

/* renderTimer(arg): arg = {ex:id} for one exercise, {wo:id} for a workout */
function renderTimer(arg){
  let plan, blocks, title;
  if(arg.wo){
    const w = data.workouts.find(x=>x.id===arg.wo);
    if(!w){ go('list'); return; }
    ({plan, blocks} = buildWorkoutPlan(w));
    title = w.name || 'Workout';
  } else {
    const ex = data.exercises.find(e=>e.id===arg.ex);
    if(!ex){ go('list'); return; }
    const blk = { name: ex.name, ex, videos: ex.videos, equipment: ex.equipment,
                  sub: planForExercise(ex), dots: totalSetsOf(ex) };
    plan = blk.sub.slice();
    plan.forEach(s => { s.blk = blk; s.exIdx = 0; });
    if(plan.length) plan.unshift({kind:'prep', dur:5, blk, exIdx:0});
    blocks = [blk]; title = ex.name;
  }
  const totalSetsAll = blocks.reduce((s,b)=>s+b.dots, 0);
  const isWo = !!arg.wo;
  timer = { iv:null, step:0, remaining:plan[0]?plan[0].dur:0, endAt:null,
            running:false, done:plan.length===0 };

  const SIZE_P=290, SIZE_L=220;
  app.innerHTML = `<div class="timer" id="tscr">
    <div class="t-top"><button class="t-back" id="back">\u2190 Back</button>
      <div class="t-name" id="tname"></div></div>
    <div class="vidrow" id="vrow" style="justify-content:center"></div>
    <div class="t-main" id="tmain">
      <div class="ringwrap" id="ringwrap">
        <svg id="ringsvg" width="290" height="290" style="transform:rotate(-90deg)">
          <circle id="ringbg" cx="145" cy="145" r="130" fill="none" stroke="var(--line)" stroke-width="10"/>
          <circle id="ring" cx="145" cy="145" r="130" fill="none" stroke-width="10" stroke-linecap="round"
            style="transition:stroke-dashoffset 1s linear, stroke .5s"/>
        </svg>
        <div class="t-digits" id="digits"></div>
      </div>
      <div class="t-side" id="tside">
        <div class="t-phase" id="phase"></div>
        <div class="t-val" id="pval"></div>
        <div class="t-val" id="equip" style="font-size:15px"></div>
        <div class="dots" id="dots"></div>
      </div>
    </div>
    <div class="t-controls" id="ctrls">
      <div class="row">
        <button class="btn ghost" id="prev" style="width:64px">\u2039\u2039</button>
        <button class="btn grow" id="toggle" style="font-size:17px"></button>
        <button class="btn ghost" id="next" style="width:64px">\u203a\u203a</button>
      </div>
      <button class="t-reset" id="resetSet">Reset this set</button>
    </div>
  </div>`;
  const $ = i => document.getElementById(i);
  $('back').onclick = ()=> go('list');

  const land = ()=> matchMedia('(orientation: landscape) and (max-height:560px)').matches;
  function geometry(){
    const S = land()?SIZE_L:SIZE_P, R=S/2-15;
    const svg=$('ringsvg'); svg.setAttribute('width',S); svg.setAttribute('height',S);
    [['ringbg'],['ring']].forEach(([id])=>{ const c=$(id);
      c.setAttribute('cx',S/2); c.setAttribute('cy',S/2); c.setAttribute('r',R); });
    const circ=2*Math.PI*R; $('ring').setAttribute('stroke-dasharray',circ);
    return circ;
  }
  let CIRC = geometry();
  addEventListener('resize', ()=>{ CIRC=geometry(); draw(); });

  function cur(){ return plan[Math.min(timer.step, plan.length-1)]; }
  function phaseColor(){ const c=cur();
    if(timer.done) return 'var(--rest)';
    if(c.kind==='prep' || c.kind==='between') return 'var(--prep)';
    if(c.kind==='rest') return 'var(--rest)';
    return c.isHeavy ? 'var(--heavy)' : 'var(--light)'; }

  let vrowFor = null;
  function drawHeader(c){
    $('tname').textContent = isWo
      ? c.blk.name + ' \u00b7 ' + (c.exIdx+1) + '/' + blocks.length
      : title;
    if(vrowFor !== c.blk){
      vrowFor = c.blk;
      const vs = (c.blk.videos||[]).filter(u=>u&&u.trim());
      $('vrow').innerHTML = vs.map((u,i)=>
        `<a class="vidlink" href="${esc(u)}" target="_blank" rel="noopener">\u25B6 Video ${i+1}</a>`).join('');
    }
  }

  function draw(){
    const c = cur();
    if(timer.done){
      $('tmain').innerHTML = `<div><div class="t-done">Done</div>
        <div class="t-done-sub">${isWo ? blocks.length+' blocks \u00b7 ' : ''}${totalSetsAll} sets complete. Nice work.</div></div>`;
      $('ctrls').innerHTML = `<div class="row">
        <button class="btn ghost grow" id="again">Run again</button>
        <button class="btn grow" id="finish">Finish</button></div>`;
      $('again').onclick = ()=> renderTimer(arg);
      $('finish').onclick = ()=> go('list');
      $('tscr').style.background = `radial-gradient(circle at 50% 30%, rgba(78,208,168,.08), var(--bg) 65%)`;
      $('tname').textContent = title;
      return;
    }
    drawHeader(c);
    $('phase').textContent = c.kind==='prep' ? 'Get ready'
      : c.kind==='between' ? 'Next: ' + c.blk.name
      : c.kind==='rest' ? 'Rest'
      : c.tStep ? c.stepName
      : c.isRun ? 'Sprint '+(c.setIndex+1)
      : (c.isHeavy ? 'Heavy set '+(c.setIndex+1) : 'Light set '+(c.setIndex-c.blk.ex.heavySets+1));
    $('phase').style.color = phaseColor();
    if(c.kind==='work'){
      const parts=[];
      if(!c.tStep && c.value) parts.push(c.value+' '+unitOf(c.blk.ex));
      if(!c.tStep && c.reps) parts.push(c.reps+' reps');
      if(c.tStep) parts.push('Step '+(c.setIndex+1)+' of '+c.blk.dots);
      $('pval').textContent = parts.join(' \u00d7 ');
      $('equip').textContent = c.blk.equipment ? '\u2699 ' + c.blk.equipment : '';
    } else { $('pval').textContent = ''; $('equip').textContent =
      (c.kind==='between' && c.blk.equipment) ? '\u2699 ' + c.blk.equipment : ''; }
    $('digits').textContent = fmt(timer.remaining);
    const ring=$('ring');
    ring.style.stroke = phaseColor();
    ring.setAttribute('stroke-dashoffset', CIRC*(1 - (c.dur>0 ? timer.remaining/c.dur : 0)));
    $('tscr').style.background = `radial-gradient(circle at 50% 30%, color-mix(in srgb, ${phaseColor()} 8%, transparent), var(--bg) 65%)`;
    const dots=$('dots'); dots.innerHTML='';
    const dEx = c.blk.ex, n = c.blk.dots;
    const si = (c.kind==='between' || c.kind==='prep') ? -1 : c.setIndex;
    for(let i=0;i<n;i++){
      const passed = si >= 0 && (i<si || (i===si && c.kind==='rest'));
      const active = i===si && c.kind==='work';
      const col = (dEx && dEx.mode!=='run' && i<dEx.heavySets) ? 'var(--heavy)' : 'var(--light)';
      const d=document.createElement('span');
      d.className='dot'+(active?' active':'');
      d.style.borderColor=col; d.style.background=(passed||active)?col:'transparent';
      dots.appendChild(d);
    }
    $('toggle').textContent = timer.running ? 'Pause'
      : (timer.step===0 && timer.remaining===plan[0].dur) ? 'Start' : 'Resume';
    $('toggle').style.background = phaseColor();
  }

  /* wall-clock deadline engine: survives iOS suspension, catches up */
  function tick(){
    if(!timer.running) return;
    const now = Date.now();
    while(now >= timer.endAt){
      const next = timer.step + 1;
      if(next >= plan.length){ sndSetEnd(); sndAllDone();
        stop(); timer.done = true; timer.remaining = 0; draw(); return; }
      const nx = plan[next];
      if(nx.kind==='work') (nx.isHeavy ? sndHeavyStart() : sndLightStart());
      else sndRestStart();
      timer.step = next;
      timer.endAt += nx.dur * 1000;
    }
    const rem = Math.ceil((timer.endAt - now) / 1000);
    if(rem !== timer.remaining){
      timer.remaining = rem;
      if(rem >= 1 && rem <= 3) sndCountTick();
      const c0 = cur();
      if(data.settings.halfway && c0.kind==='work' && c0.dur >= 20
         && rem === Math.round(c0.dur/2)) sndHalfway();
      draw();
    }
  }
  function start(){ if(timer.running||timer.done) return; ensureAudio();
    timer.endAt = Date.now() + timer.remaining*1000;
    timer.running = true; timer.iv = setInterval(tick, 250);
    sessionOn(); draw(); }
  function stop(){
    if(timer.running && timer.endAt)
      timer.remaining = Math.max(0, Math.ceil((timer.endAt - Date.now())/1000));
    timer.running=false; if(timer.iv) clearInterval(timer.iv); timer.iv=null;
    sessionOff(); }

  $('toggle').onclick = ()=>{ ensureAudio();
    if(timer.running){ stop(); draw(); }
    else { if(timer.step===0 && timer.remaining===plan[0].dur) sndPrepTick(); start(); } };
  function jumpTo(step){ timer.step = step; timer.remaining = plan[step].dur;
    timer.endAt = Date.now() + timer.remaining*1000; timer.done = false; draw(); }
  $('prev').onclick = ()=>{ if(timer.step>0){ ensureAudio(); jumpTo(timer.step-1); } };
  $('next').onclick = ()=>{ if(timer.step<plan.length-1){ ensureAudio(); jumpTo(timer.step+1); } };
  $('resetSet').onclick = ()=>{ timer.remaining = cur().dur;
    timer.endAt = Date.now() + timer.remaining*1000; draw(); };

  /* keep the screen awake during a workout where supported */
  let wakeLock=null;
  async function keepAwake(){ try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && timer && timer.running){ keepAwake(); tick(); } });

  draw();
  /* auto-start with the 5s get-ready lead */
  if(plan.length>0){ sndPrepTick(); start(); keepAwake(); }
}


/* ════════ BOOT ════════ */
/* never lose an in-progress edit when iOS suspends or closes the app */
addEventListener('pagehide', ()=>{ if(editFlush) editFlush(); });
addEventListener('beforeunload', ()=>{ if(editFlush) editFlush(); });
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden' && editFlush) editFlush();
});

renderList();
if('serviceWorker' in navigator){
  addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
